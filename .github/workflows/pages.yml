name: Deploy retail dashboard to GitHub Pages

# A new push creates a fresh Pages artifact.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/uk_retail_sales.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site data
        run: |
          mkdir -p docs/data
          cp data/uk_retail_sales.csv docs/data/uk_retail_sales.csv

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
