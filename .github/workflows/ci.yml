name: Data analysis checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python python/analysis.py
      - run: python python/load_sqlite.py
      - run: node --check docs/app.js
      - run: test -f docs/index.html && test -f docs/styles.css
